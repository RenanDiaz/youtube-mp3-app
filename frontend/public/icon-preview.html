<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Icon preview – YouTube Audio Downloader</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <style>
      body { margin: 0; padding: 32px 16px; font-family: system-ui, sans-serif; background: #0f0f0f; color: #e0e0e0; }
      h1 { font-size: 1.4rem; margin: 0 0 4px; }
      p { color: #b0b0b0; margin: 0 0 32px; }
      h2 { font-size: 1rem; color: #b0b0b0; font-weight: 500; margin: 32px 0 12px; }
      .row { display: flex; flex-wrap: wrap; gap: 24px; align-items: flex-end; }
      figure { margin: 0; text-align: center; }
      figcaption { font-size: 12px; color: #808080; margin-top: 8px; }
      img { display: block; }
      .tab { display: inline-flex; align-items: center; gap: 8px; background: #35363a; color: #e8eaed; border-radius: 8px 8px 0 0; padding: 8px 14px; font-size: 13px; }
      .light { background: #f1f3f4; color: #202124; }
      .home { display: grid; grid-template-columns: repeat(4, 72px); gap: 20px; padding: 24px; border-radius: 24px; background: linear-gradient(160deg, #3b3f7a, #1a1d3a); width: max-content; }
      .home img { width: 60px; height: 60px; border-radius: 14px; }
      .circle img { border-radius: 50%; }
      .og { max-width: 600px; width: 100%; border-radius: 8px; border: 1px solid #333; }
    </style>
  </head>
  <body>
    <h1>App icon preview</h1>
    <p>Everything here is generated by <code>npm run icons:generate</code> (see <code>frontend/generate-icons.js</code>).</p>

    <h2>Browser tab</h2>
    <div class="row">
      <span class="tab"><img src="/favicon-16x16.png" width="16" height="16" alt="" /> YouTube Audio Downloader</span>
      <span class="tab light"><img src="/favicon-16x16.png" width="16" height="16" alt="" /> YouTube Audio Downloader</span>
      <span class="tab"><img src="/favicon.svg" width="16" height="16" alt="" /> SVG favicon</span>
    </div>

    <h2>Raster sizes</h2>
    <div class="row">
      <figure><img src="/favicon-16x16.png" width="16" height="16" alt="" /><figcaption>16</figcaption></figure>
      <figure><img src="/favicon-32x32.png" width="32" height="32" alt="" /><figcaption>32</figcaption></figure>
      <figure><img src="/favicon.ico" width="48" height="48" alt="" /><figcaption>ico 48</figcaption></figure>
      <figure><img src="/apple-touch-icon.png" width="90" height="90" alt="" /><figcaption>apple-touch 180</figcaption></figure>
      <figure><img src="/icon-192.png" width="128" height="128" alt="" /><figcaption>192</figcaption></figure>
      <figure><img src="/icon-512.png" width="192" height="192" alt="" /><figcaption>512</figcaption></figure>
    </div>

    <h2>Home screen (rounded / circular masks use the maskable icons)</h2>
    <div class="home">
      <img src="/icon-512.png" alt="" />
      <img src="/icon-512-maskable.png" alt="" />
      <span class="circle"><img src="/icon-512-maskable.png" alt="" /></span>
      <img src="/apple-touch-icon.png" alt="" />
    </div>

    <h2>Social preview (og:image, 1200×630)</h2>
    <img class="og" src="/og-image.png" alt="Open Graph image" />
  </body>
</html>
