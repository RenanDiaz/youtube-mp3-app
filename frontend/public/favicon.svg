<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  
    <defs>
      <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0" stop-color="#ff1f1f"/>
        <stop offset="1" stop-color="#b80000"/>
      </linearGradient>
      <radialGradient id="glow" cx="0.3" cy="0.2" r="0.9">
        <stop offset="0" stop-color="#ffffff" stop-opacity="0.22"/>
        <stop offset="0.6" stop-color="#ffffff" stop-opacity="0"/>
      </radialGradient>
    </defs>
    <rect width="512" height="512" rx="116" fill="url(#bg)"/>
    <rect width="512" height="512" rx="116" fill="url(#glow)"/>
  
    <g transform="translate(230 256) scale(1) translate(-256 -256)"
       fill="none" stroke="#ffffff" stroke-linecap="round" stroke-linejoin="round">
      <!-- play triangle (stroke gives the rounded corners) -->
      <path d="M170 176 L170 336 L312 256 Z" fill="#ffffff" stroke-width="44"/>
      <!-- sound waves -->
      <path d="M352 190 A94 94 0 0 1 352 322" stroke-width="40"/>
      <path d="M400 142 A162 162 0 0 1 400 370" stroke-width="40" stroke-opacity="0.85"/>
    </g>
</svg>
